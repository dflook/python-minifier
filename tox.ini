[tox]
envlist = python27,python33,python34,python35,python36,python37,python38,python39,python310,python311,python312,python313,python314,pypy,pypy3

[testenv]
setenv =
    PYTHONHASHSEED = 0
    COVERAGE_FILE = {toxinidir}/.coverage.{envname}
    COVERAGE_CONTEXT = {envname}
deps = -r{toxinidir}/tox/{envname}-requirements.txt
commands =
    pytest {posargs:test --cov=python_minifier --cov-config={toxinidir}/.config/.coveragerc} --junitxml=junit-{envname}.xml --verbose

[testenv:python27]
basepython = /usr/bin/python2.7

[testenv:python33]
basepython = /usr/bin/python3.3
setenv =
    PYTHONHASHSEED = 0
    COVERAGE_FILE = {toxinidir}/.coverage.{envname}
commands =
    pytest {posargs:test --cov=python_minifier --cov-config={toxinidir}/.config/.coveragerc-legacy} --junitxml=junit-{envname}.xml --verbose

[testenv:python34]
basepython = /usr/bin/python3.4
setenv =
    PYTHONHASHSEED = 0
    COVERAGE_FILE = {toxinidir}/.coverage.{envname}
commands =
    pytest {posargs:test --cov=python_minifier --cov-config={toxinidir}/.config/.coveragerc-legacy} --junitxml=junit-{envname}.xml --verbose

[testenv:python35]
basepython = /usr/bin/python3.5

[testenv:python36]
basepython = /usr/bin/python3.6

[testenv:python37]
basepython = /usr/bin/python3.7

[testenv:python38]
basepython = /usr/bin/python3.8

[testenv:python39]
basepython = /usr/local/bin/python3.9

[testenv:python310]
basepython = /usr/local/bin/python3.10
setenv =
    PYTHONHASHSEED = 0
    COVERAGE_FILE = {toxinidir}/.coverage.{envname}
    COVERAGE_CONTEXT = {envname}
    PIP_CONSTRAINT={toxinidir}/tox/pyyaml-5.4.1-constraints.txt

[testenv:python311]
basepython = /usr/local/bin/python3.11

[testenv:python312]
basepython = /usr/local/bin/python3.12

[testenv:python313]
basepython = /usr/local/bin/python3.13

[testenv:python314]
basepython = /usr/local/bin/python3.14

[testenv:pypy]
basepython = /usr/bin/pypy

[testenv:pypy3]
basepython = /usr/bin/pypy3

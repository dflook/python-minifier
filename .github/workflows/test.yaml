name: Unit Test

on: [push]

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["python2.7", "python3.3", "python3.4", "python3.5", "python3.6", "python3.7", "python3.8", "python3.9", "python3.10", "python3.11", "python3.12", "python3.13", "python3.14", "pypy", "pypy3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false

      - name: Set version statically
        run: |
          VERSION=0.0.0
          sed -i "s/setup_requires=.*/version='$VERSION',/; s/use_scm_version=.*//" setup.py

      - name: Run tests
        uses: $/.github/actions/run-in-container
        with:
          image: danielflook/python-minifier-build:${{ matrix.python }}-2025-09-26
          run: |
            tox -r -e $(echo "${{ matrix.python }}" | tr -d .)

      - name: Upload coverage
        if: ${{ matrix.python != 'python3.3' && matrix.python != 'python3.4' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true

  test-windows:
    name: Test Windows
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        python-version: ['2.7', '3.6', '3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false

      - name: Set up Python
        if: ${{ matrix.python-version != '2.7' && matrix.python-version != '3.14' }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python 3.14
        if: ${{ matrix.python-version == '3.14' }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.0-rc.3'

      - name: Set up Python
        if: ${{ matrix.python-version == '2.7' }}
        uses: LizardByte/actions/actions/setup_python@a46850981292c4bbc0c41715f286ad95adaaaf4a  # v2026.625.20301
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set version statically
        shell: powershell
        run: |
          $content = Get-Content setup.py
          $content = $content -replace "setup_requires=.*", "version='0.0.0',"
          $content = $content -replace "use_scm_version=.*", ""
          Set-Content setup.py $content

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run tests
        run: |
          tox -c tox-windows.ini -r -e ${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-24.04
    name: Linting
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false

      - name: Lint Actions workflows
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Actions Security Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvx zizmor --format plain .

      - name: Lint CHANGELOG
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          config: '.config/changelog.markdownlint.yaml'
          globs: 'CHANGELOG.md'

      - name: Lint Other Markdown
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          config: '.config/.markdownlint.yaml'
          globs: |
            **/README.md

      - name: Lint Python code
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.16.1
          args: --config=.config/ruff.toml check

  lint_dockerfiles:
    runs-on: ubuntu-24.04
    name: Lint Dockerfiles
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile-fedora28
          - Dockerfile-fedora30
          - Dockerfile-fedora32
          - Dockerfile-fedora34
          - Dockerfile-fedora36
          - Dockerfile-fedora38
          - Dockerfile-fedora40
          - Dockerfile-fedora42
          - Dockerfile-fuzz
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ./docker/${{ matrix.dockerfile }}
          config: .config/hadolint.yaml

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install coverage
        run: pip install coverage

      - name: Combine coverage
        run: |
          ls -la .coverage*
          coverage combine --rcfile=.config/.coveragerc
          ls -la .coverage*

      - name: Upload combined coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-combined
          path: .coverage
          include-hidden-files: true

      - name: Generate report
        run: |
          coverage report --rcfile=.config/.coveragerc --format=markdown 2>&1 | tee coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
          coverage html --rcfile=.config/.coveragerc

      - name: Upload HTML report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-html-report
          path: htmlcov/

  unit-tests-passed:
    # Aggregate gate for branch protection.
    name: Unit Tests Passed
    runs-on: ubuntu-24.04
    needs: [test, test-windows, lint, lint_dockerfiles, coverage-report]
    if: ${{ always() }}
    steps:
      - name: Verify all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          exit 1
